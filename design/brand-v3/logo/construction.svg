<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img"><title>심벌 구성과 보호 공간</title><rect width="720" height="420" fill="#FAF9F6"/><style>text{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#202923}</style><g transform="translate(64 100) scale(1.5)"><path d="M48 16 H112 Q144 16 144 48 V112 L112 144 H48 Q16 144 16 112 V48 Q16 16 48 16 Z" fill="#F45B3F" /><rect x="36" y="52" width="88" height="48" rx="24" fill="#FFF1DA"></rect><ellipse cx="64" cy="70" rx="6.5" ry="8" fill="#202923"></ellipse><ellipse cx="62.5" cy="68" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><ellipse cx="96" cy="70" rx="6.5" ry="8" fill="#202923"></ellipse><ellipse cx="94.5" cy="68" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><ellipse cx="49" cy="81" rx="4.5" ry="3" fill="#FFBBA8"></ellipse><ellipse cx="111" cy="81" rx="4.5" ry="3" fill="#FFBBA8"></ellipse><path d="M73 86 Q80 93 87 86" fill="none" stroke="#202923" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><rect x="0" y="0" width="160" height="160" fill="none" stroke="#176B5B" stroke-dasharray="4 4"/><rect x="16" y="16" width="128" height="128" rx="32" fill="none" stroke="#176B5B" stroke-dasharray="4 4"/></g><text x="64" y="52" font-size="25" font-weight="700">외곽은 그대로, 얼굴은 더 또렷하게</text><text x="360" y="145" font-size="17">외곽 경로 / 오른쪽 아래 합류 절단 유지</text><text x="360" y="183" font-size="17">캡슐 x36 y52 / 88 × 48 / 반지름 24</text><text x="360" y="221" font-size="17">눈 13 × 16 / 둥근 하이라이트</text><text x="360" y="259" font-size="17">미소와 볼을 캡슐 안에 추가</text><text x="360" y="297" font-size="17">보호 공간 16 / 최소 심벌 크기 24px</text><text x="64" y="390" font-size="14">한글과 영문 워드마크는 v2 원본의 경로와 좌표를 그대로 사용합니다.</text></svg>
