<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img"><title>마주 — 생각 중이에요</title><desc>홍시색 넓은 몸과 크림 캡슐 안의 눈, 입, 볼. 테두리 없는 2D 전신.</desc><style>.actor{transform-origin:120px 143px;animation:ponder 2.8s ease-in-out infinite}.thought{animation:soft 2.8s ease-in-out infinite}@keyframes ponder{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-3px)}}@keyframes soft{0%,100%{opacity:.6}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.actor,.thought{animation:none!important}}</style><g class="thought"></g><g class="actor" transform="rotate(-4 120 143)"><path d="M95 174 L91 199" fill="none" stroke="#F45B3F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path><path d="M147 174 L141 196" fill="none" stroke="#F45B3F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path><path d="M58 129 Q39 143 48 161" fill="none" stroke="#F45B3F" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180 129 Q183 158 145 145" fill="none" stroke="#F45B3F" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"></path><path d="M84 43 H156 Q191 43 191 78 V167 L178 180 H84 Q49 180 49 145 V78 Q49 43 84 43 Z" fill="#F45B3F"></path><rect x="59" y="82" width="122" height="63" rx="31.5" fill="#FFF1DA"></rect><g transform="translate(59 82)"><ellipse cx="21" cy="38" rx="7" ry="4" fill="#FFBBA8"></ellipse><ellipse cx="98" cy="38" rx="7" ry="4" fill="#FFBBA8"></ellipse><ellipse cx="37" cy="19" rx="8" ry="10" fill="#202923"></ellipse><ellipse cx="34" cy="15" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><ellipse cx="78" cy="16" rx="8" ry="10" fill="#202923"></ellipse><ellipse cx="75" cy="12" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><ellipse cx="61" cy="45" rx="5.5" ry="6" fill="#202923"></ellipse></g><path d="M181 143 Q179 162 147 145" fill="none" stroke="#FA785B" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
