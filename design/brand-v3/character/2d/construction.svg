<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><title>마주 2D 구조</title><rect width="960" height="520" fill="#FAF9F6"/><style>text{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#202923}</style><text x="40" y="52" font-size="26" font-weight="700">마주의 공통 비례</text><text x="40" y="82" font-size="15">240 × 240 / 4pt 기준 / 몸과 얼굴은 테두리 없이</text><g transform="translate(48 120) scale(1.3)"><path d="M0 0 V240 M0 0 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 0 V240 M0 20 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M40 0 V240 M0 40 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M60 0 V240 M0 60 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M80 0 V240 M0 80 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 0 V240 M0 100 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M120 0 V240 M0 120 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M140 0 V240 M0 140 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M160 0 V240 M0 160 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180 0 V240 M0 180 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M200 0 V240 M0 200 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M220 0 V240 M0 220 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M240 0 V240 M0 240 H240" fill="none" stroke="#CCC6BC" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"></path><g class="thought"></g><g class="actor" transform="rotate(0 120 143)"><path d="M94 174 L91 198" fill="none" stroke="#F45B3F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path><path d="M147 174 L151 198" fill="none" stroke="#F45B3F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path><path d="M59 126 Q34 137 39 157" fill="none" stroke="#F45B3F" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"></path><path d="M181 126 Q205 138 200 157" fill="none" stroke="#F45B3F" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"></path><path d="M84 43 H156 Q191 43 191 78 V167 L178 180 H84 Q49 180 49 145 V78 Q49 43 84 43 Z" fill="#F45B3F"></path><rect x="59" y="82" width="122" height="63" rx="31.5" fill="#FFF1DA"></rect><g transform="translate(59 82)"><ellipse cx="21" cy="38" rx="7" ry="4" fill="#FFBBA8"></ellipse><ellipse cx="98" cy="38" rx="7" ry="4" fill="#FFBBA8"></ellipse><ellipse cx="39" cy="21" rx="9" ry="11" fill="#202923"></ellipse><ellipse cx="37" cy="18" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><ellipse cx="80" cy="21" rx="9" ry="11" fill="#202923"></ellipse><ellipse cx="78" cy="18" rx="3" ry="3.5" fill="#FFFFFF"></ellipse><path d="M50 42 Q61 53 72 42" fill="none" stroke="#202923" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></g></g><rect x="49" y="43" width="142" height="137" rx="35" fill="none" stroke="#176B5B" stroke-width="1" stroke-dasharray="4 4"></rect><rect x="59" y="82" width="122" height="63" rx="31.5" fill="none" stroke="#176B5B" stroke-width="1" stroke-dasharray="4 4"></rect></g><g transform="translate(400 120)"><text y="25" font-size="18" font-weight="700">전신</text><text y="56" font-size="16">몸 x49 y43 / 142 × 137 / 모서리 35</text><text y="86" font-size="16">크림 얼굴 x59 y82 / 122 × 63</text><text y="116" font-size="16">눈 중심 (98,103), (139,103)</text><text y="146" font-size="16">입 중심 (120,125) / 볼 (80,120), (157,120)</text><text y="208" font-size="18" font-weight="700">32px 아바타</text><text y="239" font-size="16">홍시색이 정사각형 전체를 채움</text><text y="269" font-size="16">크림 얼굴 x27 y65 / 186 × 112</text><text y="299" font-size="16">최소 입 두께 1.2px / 하이라이트는 둥글게</text></g><text x="48" y="486" font-size="14">눈 + 입 + 자세를 함께 바꿔 8개 표정을 구별합니다. 외곽선이나 흰 스티커 테두리는 쓰지 않습니다.</text></svg>
