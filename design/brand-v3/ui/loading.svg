.dot { animation: mazu-dot 1.6s ease-in-out infinite; }
.dot-2 { animation-delay: .2s; } .dot-3 { animation-delay: .4s; }
@media (prefers-reduced-motion: reduce) { .bob, .dot { animation: none; } .dot { opacity: .6; } }
</style>
